<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="{{ url_for('home') }}">Inicio</a>
            <a href="{{ url_for('about') }}">Acerca de</a>
        </nav>
    </header>

    <main class="container">
        <h1>{{ mensaje }}</h1>
        <p>Estos son los listados disponibles:</p>

        <ul>
            {% for item in listas %}
                <li>
                    <a href="{{ url_for('detalle_lista', slug=item.slug) }}">{{ item.nombre }}</a>
                </li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
