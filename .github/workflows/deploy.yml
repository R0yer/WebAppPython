name: deploy

'on':
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

jobs:
  first-job:
    runs-on: ubuntu-24.04

    steps:
    - name: Mostrar configuración
      run: |
        echo "Host: ${{ secrets.SERVER_HOST }}"
        echo "Usuario: ${{ secrets.SERVER_USER }}"

    - name: Deploy - Forzar actualización de código y reinicio limpio
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
            # 1. Traer los cambios exactos de GitHub reemplazando todo lo local
            cd /var/www/python-web-app
            git fetch origin main
            git reset --hard origin/main

            # 2. Reinstalar dependencias
            python3 -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt

            # 3. Asegurar la configuración del servicio
            mkdir -p /home/roger/.config/systemd/user/

            cat << 'EOF' > /home/roger/.config/systemd/user/python-web-app.service
            [Unit]
            Description=Python Web Application
            After=network.target

            [Service]
            WorkingDirectory=/var/www/python-web-app
            ExecStart=/var/www/python-web-app/.venv/bin/gunicorn --workers 3 --bind 127.0.0.1:5000 app:app
            Restart=always

            [Install]
            WantedBy=default.target
            EOF

            # 4. MATAR procesos viejos de Gunicorn colgados en memoria
            pkill -f gunicorn || true

            # 5. Recargar systemd y arrancar el servicio de cero
            systemctl --user daemon-reload
            systemctl --user enable python-web-app.service
            systemctl --user restart python-web-app.service

            # 6. Recargar Nginx para forzar el refresco de conexiones
            sudo systemctl reload nginx || true