name: deploy

'on':
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

jobs:
  first-job:
    runs-on: ubuntu-24.04

    steps:
    - name: Mostrar configuración
      run: |
        echo "Host: ${{ secrets.SERVER_HOST }}"
        echo "Usuario: ${{ secrets.SERVER_USER }}"

    - name: iniciando deploy - instalando dependencias   
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
            sudo mkdir -p /var/www/python-web-app
            sudo chown -R $USER:$USER /var/www/python-web-app

            cd /var/www/python-web-app

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            python3 -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt

            # Detener el proceso anterior
            pkill -f gunicorn || true

            # Iniciar Gunicorn completamente desacoplado de la sesión SSH
            nohup .venv/bin/gunicorn --workers 3 --bind 0.0.0.0:5000 app:app > app.log 2>&1 < /dev/null &
            sleep 2